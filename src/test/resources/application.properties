spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
server.port=8081

# H2 Database Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.default-executor-type=SIMPLE

# Mail Configuration for Testing
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.kafka.enabled=false

# Signs and checks access tokens; Spring refuses to start without one of at least 32 bytes. Test-only value.
jwt.secret=test-only-jwt-secret-not-for-production-0123456789

# Shared with the auth service for login and registration; Spring refuses to start without 32+ bytes. Test-only value.
internal.api.key=test-only-internal-api-key-not-for-production-0123456789
